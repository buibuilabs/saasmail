name: Sync upstream

on:
  schedule:
    # Mondays 15:00 UTC. Run by hand from the Actions tab anytime.
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Merge choyiny/saasmail main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/choyiny/saasmail.git
          git fetch upstream main
          git merge upstream/main --no-edit -m "Merge upstream/main into buibuilabs/saasmail"
          git push origin HEAD:main
